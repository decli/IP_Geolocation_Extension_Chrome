name: Release

on:
  push:
    branches: [main]
    paths: [manifest.json]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to rebuild and publish
        required: true
        type: string

env:
  REQUESTED_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
  AUTO_RELEASE: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Resolve and validate release version
        run: |
          VERSION="$(node -p 'require("./manifest.json").version')"
          RELEASE_TAG="${REQUESTED_TAG:-v$VERSION}"
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "Release tag must match manifest version" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Test
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build ZIP
        run: |
          npm run build
          mkdir -p dist
          cp build/chrome.zip "dist/IP-Geolocation-Extension-Chrome-${RELEASE_TAG}.zip"

      - name: Prepare clean CRX source
        run: |
          bash build.sh dev chrome
          test ! -e dev/chrome.zip

      - name: Check for CRX signing key
        id: crx-signing
        env:
          CRX_PRIVATE_KEY_BASE64: ${{ secrets.CRX_PRIVATE_KEY_BASE64 }}
        run: |
          if [ -n "$CRX_PRIVATE_KEY_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed CRX
        if: steps.crx-signing.outputs.available == 'true'
        env:
          CRX_PRIVATE_KEY_BASE64: ${{ secrets.CRX_PRIVATE_KEY_BASE64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/extension.pem"
          trap 'rm -f "$KEY_PATH"' EXIT
          printf '%s' "$CRX_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable)"
          xvfb-run --auto-servernum "$CHROME_BIN" \
            --no-sandbox \
            --disable-gpu \
            --pack-extension="$GITHUB_WORKSPACE/dev" \
            --pack-extension-key="$KEY_PATH"
          mv dev.crx "dist/IP-Geolocation-Extension-Chrome-${RELEASE_TAG}.crx"
          test -s "dist/IP-Geolocation-Extension-Chrome-${RELEASE_TAG}.crx"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$AUTO_RELEASE" = "true" ]; then
              echo "$RELEASE_TAG already exists; keeping its published assets unchanged."
              exit 0
            fi
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --target "$(git rev-parse HEAD)" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
